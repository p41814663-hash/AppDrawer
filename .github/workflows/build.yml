name: Build AppDrawer
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg wget perl xz-utils
          git clone --recurse-submodules https://github.com/theos/theos.git ~/.theos
          chmod +x ~/.theos/bin/dm.pl
          echo "THEOS=~/.theos" >> $GITHUB_ENV
          echo "PATH=~/.theos/bin:$PATH" >> $GITHUB_ENV
      - name: Install iOS SDK
        run: |
          ~/.theos/bin/install-sdk 17.0
      - name: Verify Theos
        run: |
          ls -la ~/.theos/sdks/
          dm.pl --version
      - name: Build .deb
        run: |
          ls -la
          if [ -d "AppDrawer" ]; then
            cd AppDrawer
          fi
          make package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdrawer-deb
          path: "**/*.deb"
