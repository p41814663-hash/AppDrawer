
name: Build AppDrawer
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg wget perl xz-utils libtinfo6
          git clone --recurse-submodules https://github.com/theos/theos.git ~/.theos
          chmod +x ~/.theos/bin/dm.pl
          chmod +x ~/.theos/bin/logos.pl
          chmod +x ~/.theos/vendor/logos/bin/logos.pl
          echo "THEOS=~/.theos" >> $GITHUB_ENV
          echo "PATH=~/.theos/bin:$PATH" >> $GITHUB_ENV
      - name: Install iOS SDK
        run: |
          mkdir -p ~/.theos/sdks
          cd ~/.theos/sdks
          wget -q "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar -xf iPhoneOS16.5.sdk.tar.xz
          rm -f iPhoneOS16.5.sdk.tar.xz
          ls -la
      - name: Install toolchain
        run: |
          mkdir -p ~/.theos/toolchain
          cd ~/.theos/toolchain
          echo "Downloading toolchain..."
          wget -v "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz"
          echo "Extracting..."
          tar -xvf iOSToolchain-x86_64.tar.xz
          rm -f iOSToolchain-x86_64.tar.xz
          echo "=== Toolchain structure ==="
          find . -type f -name "clang" | head -5
          ls -la linux/iphone/bin/clang
      - name: Check Theos makefiles
        run: |
          ls -la ~/.theos/makefiles/
          grep -r "logos.pl" ~/.theos/makefiles/ | head -5
          cat ~/.theos/makefiles/instance/rules.mk | grep -A5 -B5 "\.xm" | head -20
      - name: Build .deb
        run: |
          ls -la
          if [ -d "AppDrawer" ]; then
            cd AppDrawer
          fi
          make package \
            TARGET=iphone:clang:16.5:15.0 \
            ARCHS=arm64 \
            DEBUG=0 \
            ADDITIONAL_CFLAGS="-I$HOME/.theos/vendor/include" \
            ADDITIONAL_LDFLAGS="-F$HOME/.theos/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdrawer-deb
path: "**/*.deb"
