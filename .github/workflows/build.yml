name: Build AppDrawer
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg wget perl
          git clone https://github.com/theos/theos.git ~/.theos
          # dm.pl is in vendor/perl/ - ensure it's accessible
          chmod +x ~/.theos/vendor/perl/dm.pl
          ln -sf ~/.theos/vendor/perl/dm.pl ~/.theos/bin/dm.pl
          echo "THEOS=~/.theos" >> $GITHUB_ENV
          echo "PATH=~/.theos/bin:$PATH" >> $GITHUB_ENV
      - name: Verify Theos
        run: |
          ls -la ~/.theos/bin/dm.pl
          dm.pl --version
      - name: Build .deb
        run: |
          ls -la
          if [ -d "AppDrawer" ]; then
            cd AppDrawer
          fi
          make package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdrawer-deb
          path: "**/*.deb"
